name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare or create release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_sha: ${{ steps.release.outputs.sha }}
      release_version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main

  publish-windows:
    name: Build and attach Windows package
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout released revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.release_sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Test and build release package
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Verify version and packaged files
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.release-please.outputs.release_version }}
        run: |
          $binary = ".\dist\blind-dev-setup-windows-x64.exe"
          $reportedVersion = (& $binary version).Trim()
          $expectedVersion = "blind-dev-setup $env:EXPECTED_VERSION"
          if ($reportedVersion -ne $expectedVersion) {
            throw "Binary version '$reportedVersion' does not match release '$expectedVersion'."
          }

          $inspectionDirectory = Join-Path $env:RUNNER_TEMP "blind-dev-setup-package"
          Expand-Archive ".\dist\blind-dev-setup-windows-x64.zip" $inspectionDirectory
          foreach ($required in @(
            "blind-dev-setup-windows-x64.exe",
            "INICIAR-AQUI.cmd",
            "LEIA-ME.txt",
            "LICENSE"
          )) {
            if (-not (Test-Path (Join-Path $inspectionDirectory $required))) {
              throw "Release package is missing $required."
            }
          }

      - name: Attach package to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload $env:RELEASE_TAG `
            ".\dist\blind-dev-setup-windows-x64.exe" `
            ".\dist\blind-dev-setup-windows-x64.zip" `
            ".\dist\SHA256SUMS.txt" `
            --clobber
          gh release edit $env:RELEASE_TAG --draft=false --latest
