name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check, test and cross-compile
        run: bash scripts/check.sh

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Test and build
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Run read-only commands
        shell: pwsh
        run: |
          .\dist\blind-dev-setup-windows-x64.exe version
          if ($LASTEXITCODE -ne 0) { throw "version failed" }
          .\dist\blind-dev-setup-windows-x64.exe list-targets
          if ($LASTEXITCODE -ne 0) { throw "list-targets failed" }
          .\dist\blind-dev-setup-windows-x64.exe plan --target E:\
          if ($LASTEXITCODE -ne 0) { throw "plan failed" }

      - name: Prepare and verify on a temporary NTFS volume
        timeout-minutes: 35
        shell: pwsh
        run: ./scripts/test-prepare.ps1 -WorkDirectory "$env:RUNNER_TEMP\blind-dev-setup-e2e"

      - name: Clean up temporary NTFS volume
        if: always()
        timeout-minutes: 3
        shell: pwsh
        run: ./scripts/test-prepare.ps1 -WorkDirectory "$env:RUNNER_TEMP\blind-dev-setup-e2e" -Cleanup

      - name: Verify package checksums and source commit
        shell: pwsh
        run: ./scripts/test-package.ps1 -PackageDirectory ./dist -ExpectedCommit $env:GITHUB_SHA

      - name: Upload tested Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blind-dev-setup-windows-x64-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/blind-dev-setup-windows-x64.exe
            dist/blind-dev-setup-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
